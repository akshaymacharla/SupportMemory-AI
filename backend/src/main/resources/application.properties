# ============================================================
# SupportMemory AI — Spring Boot Configuration
# ============================================================

server.port=8080

# ---- Database (H2 for dev, MySQL for production) ----
spring.datasource.url=jdbc:h2:file:./data/supportmemory;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Hindsight ----
hindsight.base-url=${HINDSIGHT_BASE_URL:http://localhost:8888}
hindsight.bank-id=${HINDSIGHT_BANK_ID:support-memory-ai}

# ---- LLM (Groq) ----
llm.provider=groq
llm.api-key=${GROQ_API_KEY:}
llm.model=${GROQ_MODEL:llama-3.3-70b-versatile}
llm.groq.base-url=https://api.groq.com/openai/v1

# ---- Logging ----
logging.level.com.supportmemory=DEBUG
logging.level.org.springframework.web=INFO
